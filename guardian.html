<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeZone - Guardian Live Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0f19;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #111827;
      padding: 14px 18px;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.1rem; color: #38bdf8; font-weight: 700; }
    .status-pill {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      background: #334155;
      font-weight: bold;
    }
    .status-emergency { background: #e11d48 !important; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.6; } }

    .search-card {
      background: #1e293b;
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #334155;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
    }
    button.btn-track {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    #map { flex: 1; width: 100%; }

    /* Guardian Live Info Footer */
    .info-footer {
      background: #111827;
      border-top: 1px solid #1f2937;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-info h3 { font-size: 1rem; color: #fff; }
    .user-info p { font-size: 0.8rem; color: #94a3b8; margin-top: 2px; }
    .btn-call {
      background: #10b981;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-person-shelter"></i> Guardian View</h1>
    <span class="status-pill" id="statusBadge">Idle</span>
  </header>

  <div class="search-card">
    <input type="tel" id="victimPhoneInput" placeholder="Enter Ward's Phone (e.g. 9876543210)" value="9876543210">
    <button class="btn-track" onclick="startTrackingWard()">Track Live</button>
  </div>

  <div id="map"></div>

  <div class="info-footer">
    <div class="user-info">
      <h3 id="wardName">Tracking: --</h3>
      <p id="telemetryDetails">Battery: -- | Last updated: --</p>
    </div>
    <a href="#" class="btn-call" id="callWardBtn"><i class="fa-solid fa-phone"></i> Call</a>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAJaR1v2SyJViFY3ku5hEDMSpZqMoMqMcE",
      authDomain: "women-safety-platform-243f9.firebaseapp.com",
      projectId: "women-safety-platform-243f9",
      storageBucket: "women-safety-platform-243f9.firebasestorage.app",
      messagingSenderId: "66949809685",
      appId: "1:66949809685:web:2021e5f5d9a206cfaeb01c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const map = L.map('map', { zoomControl: false }).setView([12.9716, 77.5946], 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '© CARTO'
    }).addTo(map);

    let wardMarker = null;
    let unsubscribe = null;

    function startTrackingWard() {
      const phone = document.getElementById('victimPhoneInput').value.trim().replace(/[^0-9]/g, '');
      if (!phone) return alert("Please enter a valid phone number");

      if (unsubscribe) unsubscribe(); // detach previous listener

      const docId = `user_${phone}`;
      const statusBadge = document.getElementById('statusBadge');

      unsubscribe = db.collection("alerts").doc(docId).onSnapshot((doc) => {
        if (!doc.exists) {
          statusBadge.innerText = "No Data Found";
          statusBadge.className = "status-pill";
          return;
        }

        const data = doc.data();
        document.getElementById('wardName').innerText = data.user_name || "Ward";
        document.getElementById('telemetryDetails').innerText = `Battery: ${data.battery_level || 'N/A'} | ${data.timestamp || 'Live'}`;
        document.getElementById('callWardBtn').href = `tel:${data.phone}`;

        const lat = data.latitude;
        const lng = data.longitude;

        if (wardMarker) {
          wardMarker.setLatLng([lat, lng]);
        } else {
          wardMarker = L.marker([lat, lng]).addTo(map);
        }

        map.setView([lat, lng], 16);

        if (data.is_alert_active) {
          statusBadge.innerText = "🚨 EMERGENCY ACTIVE";
          statusBadge.className = "status-pill status-emergency";
          wardMarker.bindPopup(`<b>⚠️ SOS Active!</b><br>${data.user_name}`).openPopup();
        } else {
          statusBadge.innerText = "Safe (Monitoring)";
          statusBadge.className = "status-pill";
          wardMarker.bindPopup(`<b>Safe</b><br>${data.user_name}`);
        }
      });
    }

    // Auto-start tracking default number on load
    window.onload = startTrackingWard;
  </script>
</body>
</html>
