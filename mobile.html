<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SafeZone Mobile Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    
    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #111827;
      border-bottom: 1px solid #1e293b;
    }
    .top-bar h1 { font-size: 1.1rem; color: #f43f5e; font-weight: 700; }
    .stealth-toggle {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .container { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
    .card { background: #1e293b; border-radius: 14px; padding: 16px; border: 1px solid #334155; }
    
    .input-group { margin-bottom: 10px; }
    label { font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 4px; text-transform: uppercase; }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
    }

    /* Motion & Voice Grid */
    .sensor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sensor-box {
      background: #0f172a;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #334155;
    }
    .sensor-val { font-size: 1.8rem; font-weight: 800; color: #38bdf8; margin-top: 4px; }
    
    /* Buttons */
    .btn-sos {
      width: 100%;
      padding: 18px;
      background: #e11d48;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.25rem;
      font-weight: 800;
      box-shadow: 0 0 20px rgba(225, 29, 72, 0.4);
      cursor: pointer;
    }
    .btn-sos:active { transform: scale(0.97); }

    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-action {
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-fake-call { background: #3b82f6; color: white; }
    .btn-reset { background: #334155; color: #cbd5e1; }

    .status-text { text-align: center; font-size: 0.8rem; color: #10b981; font-weight: 600; }

    /* --- STEALTH CALCULATOR MODE --- */
    #calculatorMode {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 99999;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
    }
    .calc-screen {
      color: #fff;
      font-size: 3.5rem;
      text-align: right;
      padding: 20px 10px;
      min-height: 100px;
      word-break: break-all;
    }
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .calc-btn {
      height: 75px;
      border-radius: 50%;
      border: none;
      font-size: 1.8rem;
      font-weight: 600;
      background: #333333;
      color: #fff;
      cursor: pointer;
    }
    .calc-btn.op { background: #ff9f0a; color: #fff; }
    .calc-btn.top { background: #a5a5a5; color: #000; }
    .calc-btn.zero { grid-column: span 2; border-radius: 40px; text-align: left; padding-left: 28px; }

    /* --- FAKE INCOMING CALL MODAL --- */
    #fakeCallModal {
      display: none;
      position: fixed;
      inset: 0;
      background: #0f172a;
      z-index: 100000;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 60px 20px;
    }
    .caller-info { text-align: center; }
    .caller-avatar { width: 100px; height: 100px; border-radius: 50%; background: #334155; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
    .call-actions { width: 100%; display: flex; justify-content: space-around; }
    .call-btn { width: 70px; height: 70px; border-radius: 50%; border: none; font-size: 1.8rem; color: white; display: flex; align-items: center; justify-content: center; }
    .accept-call { background: #10b981; }
    .decline-call { background: #ef4444; }
  </style>
</head>
<body>

  <!-- App Header -->
  <div class="top-bar">
    <h1><i class="fa-solid fa-shield-halved"></i> SafeZone Client</h1>
    <button class="stealth-toggle" onclick="toggleStealth(true)"><i class="fa-solid fa-calculator"></i> Stealth Mode</button>
  </div>

  <div class="container">
    <div class="card">
      <div class="input-group">
        <label>Your Name</label>
        <input type="text" id="userName" value="Priya">
      </div>
      <div class="input-group">
        <label>Contact Phone (Unique ID)</label>
        <input type="tel" id="userPhone" value="9876543210">
      </div>
    </div>

    <!-- Active Live Sensors -->
    <div class="sensor-grid">
      <div class="sensor-box">
        <div style="font-size: 0.75rem; color:#94a3b8;"><i class="fa-solid fa-hand-fist"></i> Shakes (Goal: 5)</div>
        <div class="sensor-val" id="shakeDisplay">0</div>
      </div>
      <div class="sensor-box">
        <div style="font-size: 0.75rem; color:#94a3b8;"><i class="fa-solid fa-microphone"></i> Voice Detection</div>
        <div class="sensor-val" style="font-size: 1.1rem; color: #10b981; margin-top: 12px;" id="voiceStatus">Active</div>
      </div>
    </div>

    <button class="btn-sos" onclick="triggerEmergency('DIRECT_SOS_BUTTON')">🚨 TRIGGER SOS</button>

    <div class="action-grid">
      <button class="btn-action btn-fake-call" onclick="startFakeCallTimer()"><i class="fa-solid fa-phone-volume"></i> Fake Call (5s)</button>
      <button class="btn-action btn-reset" onclick="resetAlert()"><i class="fa-solid fa-circle-check"></i> I am Safe</button>
    </div>

    <div class="status-text" id="statusLog">● Live GPS & Accelerometer Guarding</div>
  </div>

  <!-- 1. STEALTH CALCULATOR MODE -->
  <div id="calculatorMode">
    <div class="calc-screen" id="calcScreen">0</div>
    <div class="calc-grid">
      <button class="calc-btn top" onclick="calcInput('C')">C</button>
      <button class="calc-btn top" onclick="calcInput('+/-')">±</button>
      <button class="calc-btn top" onclick="calcInput('%')">%</button>
      <button class="calc-btn op" onclick="calcInput('/')">÷</button>
      
      <button class="calc-btn" onclick="calcInput('7')">7</button>
      <button class="calc-btn" onclick="calcInput('8')">8</button>
      <button class="calc-btn" onclick="calcInput('9')">9</button>
      <button class="calc-btn op" onclick="calcInput('*')">×</button>
      
      <button class="calc-btn" onclick="calcInput('4')">4</button>
      <button class="calc-btn" onclick="calcInput('5')">5</button>
      <button class="calc-btn" onclick="calcInput('6')">6</button>
      <button class="calc-btn op" onclick="calcInput('-')">-</button>
      
      <button class="calc-btn" onclick="calcInput('1')">1</button>
      <button class="calc-btn" onclick="calcInput('2')">2</button>
      <button class="calc-btn" onclick="calcInput('3')">3</button>
      <button class="calc-btn op" onclick="calcInput('+')">+</button>
      
      <button class="calc-btn zero" onclick="calcInput('0')">0</button>
      <button class="calc-btn" onclick="calcInput('.')">.</button>
      <button class="calc-btn op" onclick="calcInput('=')">=</button>
    </div>
  </div>

  <!-- 2. FAKE CALL SIMULATOR MODAL -->
  <div id="fakeCallModal">
    <div class="caller-info">
      <div class="caller-avatar"><i class="fa-solid fa-user"></i></div>
      <h2 style="font-size: 1.6rem; margin-bottom: 6px;">Mom</h2>
      <p style="color: #94a3b8;">Mobile incoming call...</p>
    </div>
    <div class="call-actions">
      <button class="call-btn decline-call" onclick="endFakeCall()"><i class="fa-solid fa-phone-slash"></i></button>
      <button class="call-btn accept-call" onclick="acceptFakeCall()"><i class="fa-solid fa-phone"></i></button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAJaR1v2SyJViFY3ku5hEDMSpZqMoMqMcE",
      authDomain: "women-safety-platform-243f9.firebaseapp.com",
      projectId: "women-safety-platform-243f9",
      storageBucket: "women-safety-platform-243f9.firebasestorage.app",
      messagingSenderId: "66949809685",
      appId: "1:66949809685:web:2021e5f5d9a206cfaeb01c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let shakeCount = 0;
    let lastShakeTime = 0;
    let lastX = null, lastY = null, lastZ = null;
    let isEmergencyTriggered = false;
    let currentBattery = "Unknown";
    let watchId = null;

    // Battery API Reader
    if (navigator.getBattery) {
      navigator.getBattery().then(bat => {
        currentBattery = `${Math.round(bat.level * 100)}%`;
        bat.addEventListener('levelchange', () => {
          currentBattery = `${Math.round(bat.level * 100)}%`;
        });
      });
    }

    // Accelerometer Motion Tracking
    function handleMotion(e) {
      if (isEmergencyTriggered) return;
      const acc = e.accelerationIncludingGravity || e.acceleration;
      if (!acc || acc.x === null) return;

      const now = Date.now();
      if ((now - lastShakeTime) > 2500) shakeCount = 0;

      if (lastX !== null) {
        const delta = Math.abs(acc.x - lastX) + Math.abs(acc.y - lastY) + Math.abs(acc.z - lastZ);
        if (delta > 18) {
          if (now - lastShakeTime > 250) {
            shakeCount++;
            lastShakeTime = now;
            document.getElementById('shakeDisplay').innerText = shakeCount;
            if (shakeCount >= 5) triggerEmergency('SHAKE_GESTURE_5X');
          }
        }
      }
      lastX = acc.x; lastY = acc.y; lastZ = acc.z;
    }

    window.addEventListener('devicemotion', handleMotion);
    window.addEventListener('click', () => {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission().then(r => {
          if (r === 'granted') window.addEventListener('devicemotion', handleMotion);
        });
      }
      initVoiceRecognition();
    }, { once: true });

    // Web Speech API for Hands-Free Keyword Distress
    function initVoiceRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
        if (transcript.includes('help') || transcript.includes('emergency') || transcript.includes('save me') || transcript.includes('stop')) {
          triggerEmergency('VOICE_KEYWORD_DETECTED');
        }
      };
      
      recognition.onerror = () => { try { recognition.start(); } catch(e){} };
      recognition.onend = () => { try { recognition.start(); } catch(e){} };
      
      try { recognition.start(); } catch(e){}
    }

    // Continuous Live GPS Watcher & Firestore Publisher
    function triggerEmergency(source) {
      if (isEmergencyTriggered) return;
      isEmergencyTriggered = true;

      const name = document.getElementById('userName').value;
      const phone = document.getElementById('userPhone').value;
      document.getElementById('statusLog').innerHTML = `🚨 Broadcasting Emergency (${source})...`;

      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => pushAlert(name, phone, pos.coords.latitude, pos.coords.longitude, source),
          (err) => pushAlert(name, phone, 12.9716, 77.5946, source),
          { enableHighAccuracy: true, maximumAge: 0 }
        );
      } else {
        pushAlert(name, phone, 12.9716, 77.5946, source);
      }
    }

    function pushAlert(name, phone, lat, lng, source) {
      const docId = `user_${phone.replace(/[^0-9]/g, '')}`;
      db.collection("alerts").doc(docId).set({
        user_name: name,
        phone: phone,
        latitude: lat,
        longitude: lng,
        battery_level: currentBattery,
        trigger_source: source,
        is_alert_active: true,
        timestamp: new Date().toLocaleTimeString()
      }, { merge: true });
    }

    function resetAlert() {
      const phone = document.getElementById('userPhone').value;
      const docId = `user_${phone.replace(/[^0-9]/g, '')}`;

      if (watchId) navigator.geolocation.clearWatch(watchId);

      db.collection("alerts").doc(docId).update({
        is_alert_active: false
      }).then(() => {
        isEmergencyTriggered = false;
        shakeCount = 0;
        document.getElementById('shakeDisplay').innerText = "0";
        document.getElementById('statusLog').innerHTML = "● Reset Complete (Monitoring Active)";
      });
    }

    // --- STEALTH CALCULATOR ENGINE ---
    let calcExpression = "";
    function toggleStealth(show) {
      document.getElementById('calculatorMode').style.display = show ? 'flex' : 'none';
      if (!show) calcExpression = "";
    }

    function calcInput(val) {
      const screen = document.getElementById('calcScreen');
      if (val === 'C') {
        calcExpression = "";
        screen.innerText = "0";
      } else if (val === '=') {
        if (calcExpression === "9999") {
          // Secret PIN to trigger emergency
          toggleStealth(false);
          triggerEmergency('STEALTH_CALCULATOR_PIN');
          return;
        } else if (calcExpression === "0000") {
          // Secret PIN to dismiss stealth mode
          toggleStealth(false);
          return;
        }
        try {
          screen.innerText = eval(calcExpression) || "0";
          calcExpression = screen.innerText;
        } catch {
          screen.innerText = "Error";
          calcExpression = "";
        }
      } else {
        calcExpression += val;
        screen.innerText = calcExpression;
      }
    }

    // --- FAKE INCOMING CALL ENGINE ---
    let fakeCallAudio = null;
    function startFakeCallTimer() {
      document.getElementById('statusLog').innerText = "Fake call scheduled in 5 seconds...";
      setTimeout(() => {
        document.getElementById('fakeCallModal').style.display = 'flex';
        playRingtone();
      }, 5000);
    }

    function playRingtone() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 440;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        fakeCallAudio = { osc, audioCtx };
      } catch(e){}
    }

    function endFakeCall() {
      if (fakeCallAudio) {
        try { fakeCallAudio.osc.stop(); fakeCallAudio.audioCtx.close(); } catch(e){}
      }
      document.getElementById('fakeCallModal').style.display = 'none';
    }

    function acceptFakeCall() {
      endFakeCall();
      alert("Connected. Pretend you are speaking to someone.");
    }
  </script>
</body>
</html>
